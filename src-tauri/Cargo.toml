[package]
name = "personal-workbench"
version = "0.1.0"
edition = "2021"

[lib]
name = "personal_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
sha2 = "0.10.9"
base64 = "0.22.1"
libc = "0.2.189"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSError", "NSURL", "NSString"] }

[dev-dependencies]
tempfile = "3.27.0"
